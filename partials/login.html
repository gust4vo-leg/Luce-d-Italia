<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="./css/cadastro.css">
</head>
<body>
    <section class="master">
        <!-- Abaixo está a div da imagem de login -->
        <div class="img-cadastro">
            <img src="../imagens/img-cadastro.png" alt="img-logo">
        </div>

        <!-- Abaixo está a div do formulario de login -->
         <div class="form-cadastro">
            <div class="center-text">
            <!-- Titulo da página de login -->
            <div class="form-text">
                <h1>Bem vindo <span class="span-color2">de volta!</span></h1>
        
                <p>Entre na sua conta para continuar<span class="quebra-linha">sua experiência conosco.</span></p>
            </div>

                <!-- Form input -->
                <form class="informacoes" action="">
                    <div class="input-cadastro">
                        <!-- Input informações clientes -->
                        
                        <input type="email" name="email" placeholder="E-mail">
                        <input type="password" name="senha" placeholder="Senha">
                        
                    </div>   

                        <!-- Check aceitando os termos -->
                    <div class="check-cadastro">
                        <input type="checkbox" name="checkbox">
                        <div class="check-op"><p>Lembrar-se</p>
                        <span class="span-color2">Esqueci minha senha</span>
                        </div>
                        

                    </div>
                    <button class="button-login">Entrar</button>
                    <p>Não tem uma conta? <span class="span-color2">Cadastre-se</span></p>
                </form>
                
            
         </div>
         </div>
    </section>
</body>
</html>
