<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="./css/cadastro.css">
</head>
<body>
    <section class="master">
        <!-- Abaixo está a div da imagem de login -->
        <div class="img-cadastro">
            <img src="../imagens/img-cadastro.png" alt="img-logo">
        </div>

        <!-- Abaixo está a div do formulario de login -->
         <div class="form-cadastro">
            <div class="center-text">
            <!-- Titulo da página de login -->
            <div class="form-text">
                <h1>Crie sua <span class="span-color2">conta</span></h1>
        
                <p>Cadastre-se e aproveite beneficios exclusivos, <span class="quebra-linha">promoções especiais e muito mais.</span></p>
            </div>

                <!-- Form input -->
                <form class="informacoes" action="">
                    <div class="input-cadastro">
                        <!-- Input informações clientes -->
                        <input type="text" name="nome" placeholder="Nome completo">
                        <input type="email" name="email" placeholder="E-mail">
                        <input type="tel" name="telefone" placeholder="Número de telefone ">
                        <input type="password" name="senha" placeholder="Senha">
                        <input type="password" name="senha" placeholder="Confirmar senha">
                    </div>   

                        <!-- Check aceitando os termos -->
                    <div class="check-cadastro">
                        <input type="checkbox" name="checkbox">
                        <p>Aceito os <span class="span-color2">Termos de Uso</span> e a <span class="span-color2">Política de Privacidade.</span></p>
                    </div>
                    <button class="button-cadastro">Criar conta</button>
                    <p>Já tem uma conta? <span class="span-color2">Entrar</span></p>
                </form>
                
            
         </div>
         </div>
    </section>
</body>
</html>
