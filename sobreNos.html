<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Nós</title>
    <link rel="stylesheet" href="partials/css/header.css">
    <link rel="stylesheet" href="partials/css/footer.css">
    <link rel="stylesheet" href="css/sobreNos.css">
    <link rel="stylesheet" href="css/global.css">
</head>

<body>
    <section class="header">
        <div class="top-header">
            <div class="green">
                <p>TRADIÇÃO, SABOR E PAIXÃO EM CADA DETALHE</p>
            </div>

            <div class="creme">
                <img src="imagens/ornamento.png" alt="" role="presentation" />
            </div>

            <div class="red">BEM VINDO!</div>
        </div>
        <header>
            <div class="logo">
                <a href="#hero">
                    <img src="imagens/logo.png" alt="Luce d'Itália" />
                </a>
            </div>

            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="header-list">
                <i class="bi bi-list"></i>
            </button>

            <nav class="header-list" id="header-list">
                <ul class="menu">
                    <li><a class="ativo" href="../index.html">Início</a></li>
                    <li><a href="#cardapio">Cardápio</a></li>
                    <li><a href="#reservas">Reservas</a></li>
                    <li><a href="#sobre">Sobre Nós</a></li>
                </ul>

                <div class="btn-header">
                    <a href="#">
                        <i class="bi bi-person"></i>
                        <p>ENTRAR</p>
                    </a>
                </div>
            </nav>
        </header>

    </section>

    <section id="hero">
      <div class="hero">
        <div class="hero-centro">
          <div class="hero-txt">
            <h1>SOBRE NÓS</h1>
            <div class="hero-bordar-txt">
              <img src="imagens/barraFooter.png" alt="Ornamento" />
            </div>

            <div class="details-txt-hero">
              <p>
                Mais que um restaurante, a Luce D'Italia é um pedaço da Italia no coração de São Paulo. Aqui, tradição, sabor e paixão se encontram para criar experiência<strong">inesquecíveis à mesa.</strong>
              </p>
            </div>
          </div>

        </div>
        <div class="hero-right">
          <img src="imagens/imgHero.png">
        </div>
      </div>
      
      <div class="divisao-hero"></div>
    </section>
</body>

</html>
